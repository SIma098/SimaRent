{% comment %}Шаблон своего тега {% stat_card %}: плитка с иконкой Bootstrap Icons и числом.{% endcomment %}
<div class="card h-100 border-0 shadow-sm">
  <div class="card-body d-flex align-items-center">
    <i class="bi {{ icon }} text-{{ color }} mr-3" style="font-size: 2rem;"></i>
    <div>
      <div class="h4 mb-0">{{ value }}</div>
      <div class="text-muted small">{{ title }}</div>
    </div>
  </div>
</div>
